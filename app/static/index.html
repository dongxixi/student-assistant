<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>学管工作台</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><div><span class="eyebrow">STUDENT MANAGEMENT · 第一期</span><h1>学管工作台</h1><p>自动检查邮件，人工验证登录，审核后提醒学生。</p></div><div class="auth"><label>管理员令牌<input id="token" type="password" autocomplete="off" placeholder="data/admin.token 文件中的令牌"></label><button id="connect">连接</button></div></header>
<main><div id="notice" role="status"></div><section class="stats"><div><b id="n-students">—</b>学生</div><div><b id="n-verify">—</b>等待验证</div><div><b id="n-review">—</b>待审核事项</div></section>
<div class="layout"><section><div class="section-title"><h2>学生与邮箱</h2><button id="add">添加学生</button></div><div id="students" class="cards"></div><h2>采集任务</h2><p class="muted">遇到验证时，在手机批准登录或操作本机已打开的浏览器。系统会自动确认登录并继续。</p><div id="jobs" class="cards"></div></section><section><div class="section-title"><h2>学习事项审核</h2><select id="filter"><option value="active">待处理</option><option value="all">全部</option></select></div><div id="items" class="cards"></div></section></div></main>
<dialog id="student-dialog"><form id="student-form"><h2 id="form-title">添加学生</h2><input type="hidden" id="student-id"><label>学生姓名<input id="name" required maxlength="100"></label><label>邮箱账号<input id="email" required autocomplete="off"></label><label>邮箱密码<input id="password" type="password" required autocomplete="new-password"></label><label>邮箱配置 JSON<textarea id="config" rows="12" spellcheck="false"></textarea></label><p class="muted">默认 Outlook。学校 SSO 的域名需加入 allowed_hosts；其他邮箱需填写对应页面选择器。编辑时须重新输入密码。</p><div class="actions"><button type="button" id="close-student">取消</button><button type="submit">保存</button></div></form></dialog>
<dialog id="source-dialog"><h2>邮件原文</h2><pre id="source"></pre><button id="close-source">关闭</button></dialog>
<dialog id="verify-dialog"><h2>登录验证页面</h2><p>请在手机批准登录；需要输入验证码时，操作本机已打开的浏览器窗口。截图每 3 秒更新。</p><img id="verify-image" alt="当前登录页面截图"><button id="close-verify">关闭</button></dialog>
<script src="/static/app.js"></script></body></html>
